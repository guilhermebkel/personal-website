version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - chore
      - area:harness
    groups:
      next-react:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind-shadcn:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "shadcn"
          - "tw-animate-css"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/test"
          - "@axe-core/playwright"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "oxlint*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@stylistic/*"
          - "eslint-plugin-*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - chore
      - area:harness
